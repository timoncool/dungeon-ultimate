[package]
name = "du-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "axum-сервер Dungeon Ultimate: REST и SSE, одна очередь GPU, раздача собранного фронта"

[dependencies]
du-core = { path = "../du-core" }
du-rpg = { path = "../du-rpg" }
du-db = { path = "../du-db" }
du-llm = { path = "../du-llm" }
du-image = { path = "../du-image" }
du-prompts = { path = "../du-prompts" }
du-asr = { path = "../du-asr" }
# Parakeet на transcribe.cpp — та же привязка, что у Dub Studio, Speech Studio и музыкальных студий
dub-tcpp = { git = "https://github.com/timoncool/dub-studio", rev = "cf25033" }
du-tts = { path = "../du-tts" }

serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

axum = { version = "0.8", features = ["multipart"] }
tower-http = { version = "0.7", features = ["cors"] }
mime_guess = "2"
png = "0.18"
futures-util = "0.3"
ureq = "3"
# Интерфейс вшивается в бинарь: игра запускается одним файлом, без папки рядом.
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
sha2 = "0.11"
studio-hub-client = { git = "https://github.com/timoncool/studio-hub-client", rev = "365c2b757bfddd45fff67e7264b41f4f961a0032" }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
# Монитор ресурсов: карта через NVML, память через sysinfo.
nvml-wrapper = "0.13"
sysinfo = { workspace = true }
async-stream = "0.3"
tower = { version = "0.5", features = ["util"] }
# Эталон голоса из mp3 пака — без ffmpeg: раскодирование и пересэмплирование, как в студиях.
symphonia = { version = "0.6", default-features = false, features = ["mp3", "wav", "pcm", "flac", "ogg", "vorbis"] }
rubato = "5.0"
audioadapter = "5.0"
audioadapter-buffers = "5.2"
hound = "3.5"

[dev-dependencies]
tempfile = "3"
reqwest = { version = "0.13", default-features = false, features = ["json"] }

[[bin]]
name = "du-server"
path = "src/main.rs"

[lib]
name = "du_server"
path = "src/lib.rs"
