[package]
name = "du-llm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Текстовая модель: сайдкар llama-server + OpenAI-совместимый клиент со стримингом и выводом по JSON-схеме"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# Блокирующий клиент: ход истории живёт в задаче на блокирующем пуле, TLS нужен только
# для облачных бэкендов, поэтому берём rustls, а не системный стек.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
base64 = "0.22"
# Нужен, чтобы находить и убирать процессы модели, оставшиеся от прошлого запуска.
sysinfo = "0.32"

# Windows-задание (job object): в нём живёт llama-server, и система убивает его вместе с
# нами — даже если нас сняли силой и до штатного закрытия дело не дошло.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }
