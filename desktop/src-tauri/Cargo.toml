[package]
name = "dungeon-ultimate-desktop"
version = "0.13.4"
edition = "2021"
description = "Оболочка Dungeon Ultimate: поднимает сервер на 127.0.0.1 и открывает окно"

[lib]
name = "dungeon_ultimate_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"    # нативный диалог «Обновить? [Обновить] [Позже]»
tauri-plugin-updater = "2"   # авто-обновление: подписанный установщик с GitHub-релиза, в один клик
tauri-plugin-opener = "2"    # открыть страницу релиза (портатив) — замена устаревшего shell.open
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# axum-бэкенд встроен В ЭТОТ ЖЕ процесс (один exe, без dub-server.exe-сайдкара): serve_blocking с фонового потока.
du-server = { path = "../../crates/du-server" }
du-core = { path = "../../crates/du-core" }
# proc::host_command: ссылки открывает браузер компьютера без библиотек AppImage, как у Dub Studio
dub-core = { git = "https://github.com/timoncool/dub-studio", rev = "ed1f2d62ad649c83d30b3eae35957077d79e37f1" }

# Оболочка исключена из корневого воркспейса (свой Cargo.lock), поэтому корневой
# [profile.release] на неё не действует — дублируем, иначе установщик собирается без LTO.
[profile.release]
opt-level = 3
lto = "thin"
