name: Windows smoke

# Проверка того, чем игра является сейчас: сервер на Rust плюс интерфейс на Vite.
#
# Прежний набор шагов остался от версии на Next.js — он звал `npm ci` в корне, где давно
# нет ни package.json, ни линтера, ни сборки. Поэтому проверка падала на каждом коммите и
# перестала что-либо значить.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows-smoke:
    runs-on: windows-2025-vs2026
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the interface
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      # Интерфейс собирается ПЕРЕД сервером не случайно: он вшивается в бинарь.
      - name: Test the server
        run: cargo test --workspace

      # Замечания линтера показываем, но сборку ими не валим: их накопилось полсотни, и
      # честнее разгребать их отдельно, чем закрыть глаза настройкой allow.
      - name: Lint the server
        run: cargo clippy --workspace --all-targets
